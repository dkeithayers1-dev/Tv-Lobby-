{% extends "base.html" %}
{% block title %}Users · Best Fit{% endblock %}
{% block body %}
<h1>Users</h1>
<p class="lede">Passwords are hashed. They are not written into the page or the audit log.</p>
<form class="panel stack" method="post">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <div class="row">
    <label>Name <input name="display_name" required></label>
    <label>Email <input name="email" type="email" required></label>
    <label>Password <input name="password" type="password" minlength="12" required autocomplete="new-password"></label>
    <label>Role
      <select name="role">
        <option value="advisor">Advisor</option>
        <option value="finance">Finance</option>
        <option value="super_admin">Administrator</option>
      </select>
    </label>
  </div>
  <button type="submit">Create user</button>
</form>
{% for person in people %}
<form class="panel row" method="post" action="{{ url_for('user_update', user_id=person.id) }}">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <strong>{{ person.display_name }}</strong>
  <span>{{ person.email }} · {{ person.role }}</span>
  <label><span><input type="checkbox" name="active" value="1" {% if person.active %}checked{% endif %}> Active</span></label>
  <label>New password <input name="password" type="password" minlength="12" autocomplete="new-password"></label>
  <button type="submit">Update</button>
</form>
{% endfor %}
{% endblock %}

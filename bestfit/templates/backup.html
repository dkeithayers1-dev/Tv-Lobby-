{% extends "base.html" %}
{% block title %}Backup · Best Fit{% endblock %}
{% block body %}
<h1>Backup</h1>
<p>The file is encrypted with this server’s data key. It is not readable JSON. Restoring replaces contacts, invoices, communities, and users with the copy in the file.</p>
<form method="post" action="{{ url_for('backup_export') }}">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <button type="submit">Download encrypted backup</button>
</form>
<form class="panel stack" method="post" enctype="multipart/form-data">
  <input type="hidden" name="csrf" value="{{ csrf_token }}">
  <input type="hidden" name="action" value="restore">
  <label>Backup file <input type="file" name="file" required></label>
  <label>Type RESTORE <input name="confirm" autocomplete="off"></label>
  <button class="danger" type="submit">Replace current records</button>
</form>
{% endblock %}

{% extends "public/_layout.html" %}
{% block title %}Chat with {{ biz }}{% endblock %}
{% block head %}<style>
  .chat { max-width: 440px; margin: 0 auto; height: 100vh; display: flex; flex-direction: column; background: #fff; border-left: 1px solid var(--line); border-right: 1px solid var(--line); }
  .chat.embed { max-width: none; border: 0; }
  .chat-head { background: var(--brand); color: #fff; padding: 14px 16px; display: flex; gap: 10px; align-items: center; }
  .chat-head .av { width: 36px; height: 36px; border-radius: 50%; background: rgba(255,255,255,.2); display: grid; place-items: center; font-weight: 700; }
  .chat-body { flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 8px; }
  .chat-foot { border-top: 1px solid var(--line); padding: 10px; display: flex; gap: 8px; }
  .typing { color: var(--muted); font-size: 12px; padding: 0 16px 6px; display: none; }
  .bubble.in { align-self: flex-end; background: var(--brand); color: #fff; border-radius: 14px 14px 4px 14px; }
  .bubble.out { align-self: flex-start; background: #f3f4f6; color: var(--ink); border-radius: 14px 14px 14px 4px; }
  .bubble.out.team { background: #ccfbf1; }
</style>{% endblock %}
{% block body %}
<div class="chat {{ 'embed' if embed }}">
  <div class="chat-head"><div class="av">{{ agent[:1] }}</div><div><div class="strong">{{ agent }} · {{ biz }}</div><div class="small" style="opacity:.85">Typically replies instantly</div></div></div>
  <div class="chat-body" id="body"><div class="bubble out">Hi! I'm {{ agent }}. How can we help you today?</div></div>
  <div class="typing" id="typing">{{ agent }} is typing…</div>
  <form class="chat-foot" id="f"><input id="t" placeholder="Type your message…" autocomplete="off" maxlength="1000"><button class="btn primary">Send</button></form>
</div>
<script>
const body = document.getElementById('body'), t = document.getElementById('t'), typing = document.getElementById('typing');
let last = 0;
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function add(rows) {
  rows.forEach(m => {
    if (m.id <= last) return;
    last = m.id;
    body.insertAdjacentHTML('beforeend', `<div class="bubble ${m.direction} ${m.sender}">${esc(m.body)}</div>`);
  });
  body.scrollTop = body.scrollHeight;
}
async function poll() { const r = await fetch('/chat/poll?after=' + last); if (r.ok) add(await r.json()); }
document.getElementById('f').addEventListener('submit', async e => {
  e.preventDefault();
  const text = t.value.trim(); if (!text) return;
  t.value = '';
  body.insertAdjacentHTML('beforeend', `<div class="bubble in pending">${esc(text)}</div>`);
  body.scrollTop = body.scrollHeight;
  typing.style.display = 'block';
  try {
    const r = await fetch('/chat/send', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({text})});
    body.querySelectorAll('.pending').forEach(n => n.remove());
    if (r.ok) add(await r.json());
  } finally { typing.style.display = 'none'; }
});
poll(); setInterval(poll, 4000);
</script>
{% endblock %}

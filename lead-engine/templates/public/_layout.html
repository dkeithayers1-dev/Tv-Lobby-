<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}{{ biz }}{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>
    body { background: var(--bg); }
    .pub { max-width: 560px; margin: 0 auto; padding: 32px 16px 48px; }
    .pub-head { text-align: center; margin-bottom: 18px; }
    .pub-head .mark { width: 44px; height: 44px; border-radius: 12px; background: var(--brand); color: #fff; display: inline-grid; place-items: center; font-weight: 700; font-size: 18px; }
    .pub-head h1 { margin-top: 10px; }
    .slots { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; }
    .slots label { border: 1px solid var(--line); border-radius: 8px; padding: 10px; cursor: pointer; font-weight: 500; display: flex; gap: 8px; align-items: center; background: #fff; }
    .slots input:checked + span { color: var(--brand); font-weight: 700; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
{% block body %}
<div class="pub">
  <div class="pub-head"><div class="mark">{{ biz[:1] }}</div><h1>{% block heading %}{{ biz }}{% endblock %}</h1></div>
  {% with msgs = get_flashed_messages(with_categories=true) %}{% for cat, m in msgs %}<div class="flash {{ cat }}">{{ m }}</div>{% endfor %}{% endwith %}
  {% block content %}{% endblock %}
  <p class="small muted" style="text-align:center;margin-top:24px">{{ biz }}</p>
</div>
{% endblock %}
</body>
</html>
